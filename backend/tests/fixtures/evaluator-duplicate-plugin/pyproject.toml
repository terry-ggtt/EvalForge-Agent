[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-test-duplicate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["evalforge-evaluator-sdk>=0.3,<0.4"]

[project.entry-points."evalforge.evaluators"]
"keyword_coverage" = "evalforge_test_duplicate:DuplicateEvaluator"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["evalforge_test_duplicate"]
