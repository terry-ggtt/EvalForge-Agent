[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-example-evaluator"
version = "0.1.0"
description = "Minimal installed evaluator entry-point example"
requires-python = ">=3.11"
dependencies = ["evalforge-evaluator-sdk>=0.3,<0.4"]

[project.entry-points."evalforge.evaluators"]
"example.exact_match" = "evalforge_example_evaluator:ExactMatchEvaluator"

[tool.setuptools.packages.find]
where = ["src"]
